<!--
  LETTER-BY-LETTER HANDWRITING ANIMATION — "Hey, I am dhuti"
  =============================================================
  Same technique as before: each letter is its own <path> in reading
  order, revealed one at a time via getTotalLength() + stroke-dashoffset.
  This one spans two lines — reading order still goes left-to-right,
  line by line ("Hey, I am" then "dhuti"), with a longer pause after the
  comma, after "I" (end of a word), and after "am" (end of the line).

  "I" is 3 strokes (stem + top serif + bottom serif), "t" is 2 (stem +
  crossbar), "i" is 2 (stem + dot) — each combined so it draws as one
  letter, not several.
-->

  <div class="hero-inner">
    <svg

      viewBox="0 0 1440 900"
      class="signature-svg"
      aria-label="Animated signature"

<style>
  .hero-demo {
    --ink: #d9c08a;
    --bg-start: #14171c;
    --bg-end: #1d2128;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, var(--bg-end), var(--bg-start));
    font-family: -apple-system, "Segoe UI", sans-serif;
  }

  .hero-inner { text-align: center; }

  .signature-svg {
    width: min(90vw, 640px);
    height: auto;
    overflow: visible;
  }

  .letter {
    stroke: var(--ink);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .name-label {
    margin-top: 18px;
    color: #8b93a1;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 12px;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .name-label.visible { opacity: 1; }

  .replay {
    margin-top: 40px;
    display: block;
    margin-inline: auto;
    background: none;
    border: 1px solid #3a3f47;
    color: #8b93a1;
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
  }
  .replay:hover { border-color: var(--ink); color: var(--ink); }
</style>

<script>
  (function () {
    const letters = Array.from(document.querySelectorAll(".letter"));
    const label = document.getElementById("name-label");
    const replayBtn = document.getElementById("replay");
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const LETTER_DURATION = 150;     // ms each letter takes to draw
    const GAP_BETWEEN_LETTERS = 60;  // ms pause before the next letter starts
    const GAP_AFTER_WORD = 220;      // extra pause after a word-ending letter

    function resetLetter(el) {
      const len = el.getTotalLength();
      el.style.transition = "none";
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    }

    function drawLetter(el, duration) {
      el.getBoundingClientRect(); // force reflow
      el.style.transition = `stroke-dashoffset ${duration}ms ease-out`;
      requestAnimationFrame(() => {
        el.style.strokeDashoffset = 0;
      });
    }

    function play() {
      label.classList.remove("visible");
      letters.forEach(resetLetter);

      if (prefersReduced) {
        letters.forEach(el => (el.style.strokeDashoffset = 0));
        label.classList.add("visible");
        return;
      }

      let t = 0;
      letters.forEach((el) => {
        const isWordEnd = el.dataset.wordEnd === "1";
        setTimeout(() => drawLetter(el, LETTER_DURATION), t);
        t += LETTER_DURATION + (isWordEnd ? GAP_AFTER_WORD : GAP_BETWEEN_LETTERS);
      });

      setTimeout(() => label.classList.add("visible"), t + 200);
    }

    window.addEventListener("load", play);
    replayBtn.addEventListener("click", play);
  })();
</script>
